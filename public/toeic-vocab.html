<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>토익 미니 단어장</title>
<style>
:root{
  --bg:#faf6f3; --card:#fff; --ink:#2b2523; --sub:#7a6e69; --line:#eadfd9;
  --accent:#d9573b; --accent-d:#b8432b; --soft:#fcece6; --ok:#2e9e5b; --ng:#d63b3b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.5}
header{background:var(--accent);color:#fff;padding:14px 16px 0}
header h1{margin:0;font-size:19px}
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.backbtn{flex:none;border:0;background:rgba(255,255,255,.22);color:#fff;padding:7px 12px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.backbtn:hover{background:rgba(255,255,255,.32)}
@media (max-width:560px){ header h1{font-size:17px} header h1 .long{display:none} }
.tabs{display:flex;gap:6px}
.tab{border:0;background:rgba(255,255,255,.22);color:#fff;padding:9px 18px;border-radius:10px 10px 0 0;font-size:15px;font-weight:600;cursor:pointer}
.tab.on{background:var(--bg);color:var(--accent-d)}
main{max-width:980px;margin:0 auto;padding:14px 14px 60px}
.hidden{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 11px;border-radius:999px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.ghost{border-style:dashed;color:var(--sub)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--accent-d)}
.btn.big{font-size:16px;padding:10px 20px}
.toggle{font-size:14px;display:flex;align-items:center;gap:5px;color:var(--sub);cursor:pointer;user-select:none}
.daytitle{display:flex;align-items:baseline;gap:10px;margin:4px 0 12px}
.daytitle h2{margin:0;font-size:28px;color:var(--accent-d)}
.daytitle span{color:var(--sub);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.wcard .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wcard .no{color:var(--sub);font-size:12px;min-width:20px}
.wcard .w{font-size:19px;font-weight:800}
.wcard .mean{margin-top:4px;font-size:15px;cursor:default}
.wcard .ex{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--sub)}
.wcard .ex b{color:var(--ink);font-weight:600}
.hide-mean .mean .mtext{filter:blur(7px);cursor:pointer;transition:filter .15s}
.hide-mean .mean.show .mtext{filter:none}
.hide-ex .ex{display:none}
.pos{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:3px;border:1px solid;vertical-align:1px}
.pos[data-p="명"]{color:#2a6fb5;background:#e8f1fb;border-color:#b5d0ee}
.pos[data-p="동"]{color:#c0392b;background:#fdecea;border-color:#f2b9b2}
.pos[data-p="형"]{color:#2e8b57;background:#e8f6ee;border-color:#b3dfc4}
.pos[data-p="부"]{color:#a1620d;background:#fff3e0;border-color:#f1d29b}
.pos[data-p="표현"]{color:#de88f1;background:#f6e0ff;border-color:#d09bf1}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.daybtn{border:0;background:none;padding:0;font:inherit;font-size:28px;font-weight:700;color:var(--accent-d);cursor:pointer;display:flex;align-items:center;gap:6px}
.daybtn::after{content:"▾";font-size:16px;color:var(--sub)}
.daybtn:hover{color:var(--accent)}

/* Day 선택 화면 */
#dayPick{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column}
#dayPick[hidden]{display:none}
html.picking{overflow:hidden}
#dayPick .scroll{flex:1;overflow-y:auto;padding:20px 16px 24px}
#dayPick .inner{max-width:560px;margin:0 auto}
#dayPick .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
#dayPick h2{margin:0;font-size:22px;color:var(--accent-d)}
#dayPick .sub{margin:0 0 16px;color:var(--sub);font-size:14px}
#dayPick .x{border:0;background:none;font-size:26px;line-height:1;color:var(--sub);cursor:pointer;padding:4px 8px}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.dcell{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 4px;cursor:pointer;color:var(--ink);text-align:center}
.dcell:hover{border-color:var(--accent)}
.dcell b{display:block;font-size:22px;line-height:1.2}
.dcell small{display:block;color:var(--sub);font-size:12px}
.dcell.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dcell.on small{color:rgba(255,255,255,.85)}
.daygrid.multi .dcell{position:relative}
.daygrid.multi .dcell.on::after{content:"✓";position:absolute;top:4px;right:8px;font-size:13px;font-weight:800}
.pickswitch{display:block;width:100%;margin-top:18px}
.pickswitch[hidden]{display:none}
.pickbar{border-top:1px solid var(--line);background:var(--card);padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px))}
.pickbar .inner{display:flex;gap:8px}
.pickbar .primary{flex:1}
.pickbar .primary:disabled{opacity:.45;cursor:default}
.chip.range{font-weight:600}

/* test */
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.toolbar .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px}
.score{margin-left:auto;font-weight:800;color:var(--accent-d)}
.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sheet h3{margin:0;padding:12px 16px;background:var(--soft);font-size:15px;border-bottom:1px solid var(--line)}
.q{display:grid;grid-template-columns:34px minmax(110px,1.1fr) minmax(130px,1.6fr) 54px;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid #f3ebe6}
.q:last-child{border-bottom:0}
.q .n{color:var(--accent);font-weight:800}
.q .p{font-weight:700;font-size:16px}
.q .p.ko{font-size:14.5px;font-weight:600}
.q input{width:100%;padding:8px 10px;border:0;border-bottom:2px solid var(--line);font-size:15px;background:transparent;outline:none}
.q input:focus{border-bottom-color:var(--accent)}
.q .res{text-align:center;font-weight:900;font-size:18px;cursor:pointer;user-select:none}
.q.ok{background:#f1fbf5}.q.ok .res{color:var(--ok)}
.q.ng{background:#fff3f2}.q.ng .res{color:var(--ng)}
.q .ans{grid-column:2 / 5;font-size:13.5px;color:var(--ng);display:none}
.q .ans.on{display:block}
.q.ok .ans{color:var(--ok)}
.empty{padding:30px;text-align:center;color:var(--sub)}
.star{border:0;background:none;font-size:21px;cursor:pointer;color:#cfc6c1;padding:0 2px;line-height:1}
.star.on{color:#f5a623}
.wcard .top .star{margin-left:auto}
.q .p .star{font-size:17px;margin-left:4px;vertical-align:-1px}
.badge-wrong{font-size:11px;color:var(--ng);border:1px solid #f2b9b2;background:#fff3f2;border-radius:999px;padding:0 7px}
.tag{font-size:11px;color:var(--sub);background:var(--soft);border-radius:999px;padding:0 7px}
.btn.sm{padding:4px 9px;font-size:12px}
.note{color:var(--sub);font-size:12.5px;margin:0 0 10px}
@media (max-width:560px){
  .q{grid-template-columns:28px 1fr 44px}
  .q .p{grid-column:2 / 4}
  .q .in{grid-column:2 / 3}
  .q .res{grid-column:3 / 4;grid-row:2}
  .q .ans{grid-column:2 / 4}
}
@media print{
  header,.toolbar .row,.chips,.pager,.tabs,#dayPick{display:none!important}
  .toolbar{position:static;border:0}
  body{background:#fff}
}
/* 비밀번호 잠금 화면 */
html.locked body>*:not(#lock){display:none!important}
#lock{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
html:not(.locked) #lock{display:none}
#lock form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:100%;max-width:320px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
#lock h2{margin:0 0 6px;font-size:20px;color:var(--accent-d)}
#lock p{margin:0 0 16px;color:var(--sub);font-size:14px}
#lock input{width:100%;font-size:22px;letter-spacing:.4em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;outline:none}
#lock input:focus{border-color:var(--accent)}
#lock .btn{width:100%}
#lock .err{min-height:20px;margin:8px 0 0;color:var(--ng);font-size:13.5px}
#lock.shake form{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
</style>
<script>
/* 잠금 해제 전에는 화면을 숨겨 내용이 잠깐 보이는 것을 막음 (탭을 닫으면 다시 잠김) */
try{ if(sessionStorage.getItem('tv_unlock')!=='1') document.documentElement.classList.add('locked'); }
catch(e){ document.documentElement.classList.add('locked'); }
</script>
</head>
<body>
<div id="lock">
  <form id="lockForm" autocomplete="off">
    <h2>🔒 잠긴 단어장</h2>
    <p>비밀번호를 입력하세요</p>
    <input id="lockPw" type="password" inputmode="numeric" maxlength="20" aria-label="비밀번호" autofocus>
    <button class="btn primary big" type="submit">열기</button>
    <div class="err" id="lockErr"></div>
  </form>
</div>
<div id="dayPick" hidden role="dialog" aria-labelledby="dayPickTitle">
  <div class="scroll"><div class="inner">
    <div class="head"><h2 id="dayPickTitle"></h2><button class="x" id="dayPickClose" aria-label="닫기">✕</button></div>
    <p class="sub" id="dayPickSub"></p>
    <div class="daygrid" id="dayGrid"></div>
    <button class="btn pickswitch" id="pickToTest">📝 여러 Day/Unit 골라서 시험보기</button>
  </div></div>
  <div class="pickbar" id="pickBar">
    <div class="inner">
      <button class="btn" id="pickAll"></button>
      <button class="btn primary big" id="pickStart"></button>
    </div>
  </div>
</div>
<header>
  <div class="hrow">
    <button class="backbtn" id="backPick" aria-label="Day/Unit 다시 선택">← Day/Unit 선택</button>
    <h1>📘 <span class="long"></span>미니 단어장<span class="long"> (Day 01–20 · Unit 01–07)</span></h1>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="vocab">단어장</button>
    <button class="tab" data-tab="test">단어시험</button>
    <button class="tab" data-tab="mine">내 단어장</button>
  </div>
</header>

<main>
  <!-- 단어장 -->
  <section id="viewVocab">
    <div class="bar">
      <label class="toggle"><input type="checkbox" id="hideMean"> 뜻 가리기</label>
      <label class="toggle"><input type="checkbox" id="hideEx"> 예문 숨기기</label>
      <button class="btn" id="vocabShuffle">🔀 새로고침</button>
      <button class="btn" id="vocabReset">원래 순서</button>
    </div>
    <div class="daytitle"><h2><button class="daybtn" id="vTitle" title="Day/Unit 선택"></button></h2><span id="vCount"></span></div>
    <div class="grid" id="vocabGrid"></div>
    <div class="pager">
      <button class="btn" id="prevDay">← 이전 Day/Unit</button>
      <button class="btn primary" id="nextDay">다음 Day/Unit →</button>
    </div>
  </section>

  <!-- 단어시험 -->
  <section id="viewTest" class="hidden">
    <div class="toolbar">
      <div class="row">
        <button class="btn primary big" id="refresh">🔄 새로고침</button>
        <select id="mode">
          <option value="en2ko">영어 → 한글</option>
          <option value="ko2en">한글 → 영어</option>
        </select>
        <button class="btn" id="gradeBtn">✅ 채점하기</button>
        <button class="btn" id="ansBtn">👀 정답 보기</button>
        <button class="btn" id="printBtn">🖨 인쇄</button>
        <label class="toggle"><input type="checkbox" id="autoRm"> 맞히면 오답노트에서 삭제</label>
        <span class="score" id="score"></span>
      </div>
    </div>
    <div class="chips" id="testChips"></div>
    <div class="sheet">
      <h3 id="sheetTitle"></h3>
      <div id="sheetBody"></div>
    </div>
  </section>
  <!-- 내 단어장 -->
  <section id="viewMine" class="hidden">
    <div class="chips" id="mineChips"></div>
    <div class="bar">
      <button class="btn primary" id="mineTest">🎯 이 단어들로 시험보기</button>
      <label class="toggle"><input type="checkbox" id="mineHide"> 뜻 가리기</label>
      <button class="btn" id="mineClear">🗑 목록 비우기</button>
      <button class="btn" id="mineExport">백업 복사</button>
      <button class="btn" id="mineImport">백업 복원</button>
    </div>
    <div class="grid" id="mineGrid"></div>
  </section>
</main>

<script>
/* 데이터 형식: 단어|[품사] 뜻|예문 */
const RAW = {
1:`announce|[동] 발표하다, 알리다|announce a change 변화를 발표하다 · announce a plan 계획을 알리다
facility|[명] 시설, 기관|a recycling facility 재활용 시설
conduct|[동] 진행하다, 실시하다, 지휘하다|conduct an interview 인터뷰하다 · conduct a survey 설문 조사하다
appointment|[명] 약속, 임명, 지명|schedule an appointment 약속을 잡다
permission|[명] 허가, 허락, 승인|written permission 서면 허가
extensive|[형] 광범위한, 대규모의, 폭넓은|extensive research 광범위한 조사 · extensive knowledge 폭넓은 지식
favorable|[형] 호의적인, 유리한, 좋은|favorable reviews 호의적인 평가, 호평
temporarily|[부] 일시적으로, 잠정적으로|temporarily close 일시적으로 닫다
personally|[부] 직접, 개인적으로 (= in person)|personally respond 직접 답변하다
address|[동] 처리하다; 연설하다 [명] 주소|address an issue 문제를 처리하다
remove|[동] 제거하다, 없애다; (옷, 모자 등을) 벗다|remove stains 얼룩을 제거하다
renew|[동] 갱신하다, 연장하다|renew a subscription 구독을 갱신하다
notify|[동] ~에게 알리다, ~에게 통보하다|notify you of our decision 우리의 결정 사항을 통보하다
notice|[명] 통보, 통지, 공고문, 안내문 [동] 알아차리다, 주목하다|advance notice 사전 통보
negotiation|[명] 협상, 협의|after a month of negotiation 한 달 간의 협상 후에
agenda|[명] (회의) 안건, 의제|a meeting agenda 회의 안건
opening|[명] 공석, 빈자리, 개막식, 개관식|job openings 일자리
opportunity|[명] 기회|an opportunity to V ~할 기회
fragile|[형] 깨지기 쉬운, 취약한|fragile items 깨지기 쉬운 물품들
supervisor|[명] 감독관, 관리자, 상관|an immediate supervisor 직속 상관
exceed|[동] 초과하다, 넘다|exceed speed limit 제한 속도를 초과하다 · exceed expectations 기대를 넘다
relatively|[부] 상대적으로, 비교적|relatively lightweight 비교적 가벼운
unanimously|[부] 만장일치로|unanimously choose 만장일치로 선택하다
disregard|[동] 무시하다, 묵살하다 [명] 무시|disregard this e-mail 이 이메일을 무시하다
acquire|[동] 얻다, 획득하다, 인수하다|acquire a company 회사를 인수하다
accurate|[형] 정확한|an accurate estimate 정확한 견적
costly|[형] 값비싼|costly renovations 비싼 보수공사
perishable|[형] 잘 상하는, 부패하기 쉬운|perishable products 상하기 쉬운 제품들
refreshments|[명] 다과|light refreshments 간단한 다과
budget|[명] 예산 [형] 저가의, 저렴한 [동] 예산을 책정하다|a budget cut 예산 삭감
minor|[형] 작은, 사소한; 소수의 [명] 미성년자|a minor issue 사소한 문제
unfortunately|[부] 안타깝게도, 공교롭게도|Unfortunately, we lost. 안타깝게도, 우리가 졌어요.`,

2:`obtain|[동] 얻다, 승인하다|obtain approval 승인을 얻다
attend|[동] 참석하다|attend an event 행사에 참석하다
missing|[형] 분실된, 빠진, 실종된|missing parts 빠진 부품들
nearly|[부] 거의|nearly complete 거의 끝난 · nearly 30% 거의 30%
major|[형] 주요한 [명] 전공|major credit cards 주요 신용카드
updated|[형] 업데이트된, 최신의, 갱신된|updated version 최신 버전
mandatory|[형] 의무적인, 필수의|mandatory training sessions 의무 훈련 과정
recently|[부] 최근에|recently renovated 최근에 보수된
modify|[동] 수정하다|modify the terms (계약) 조건을 수정하다
typically|[부] 일반적으로, 보통|typically cost $100 일반적으로 100달러이다
itinerary|[명] 여행 일정(표)|a travel itinerary 여행 일정
efficient|[형] 효율적인, 유능한|energy efficient 에너지 효율이 좋은
consistently|[부] 일관적으로, 꾸준히, 한결같이|consistently high 한결같이 높은
attract|[동] 끌어들이다|attract tourists 관광객을 끌어들이다 · attract funds 자금을 끌어 모으다
limited|[형] 제한된, 한정된|for a limited time only 한시적으로만
assistance|[명] 도움, 지원|seek assistance 도움을 구하다
object|[동] 반대하다 [명] 물체|object to ~에 반대하다
shortage|[명] 부족 (유 lack)|a shortage of labor 노동력 부족
rigorous|[형] 엄격한, 철저한|a rigorous standard 엄격한 기준
largely|[부] 주로, 대개|due largely to 주로 ~ 때문에
donate|[동] 기부하다, 기증하다|donate used books 중고책을 기부하다
upcoming|[형] 다가오는, 곧 있을|an upcoming event 다가오는 행사

missing|[형] (짐, 물건이) 분실된|missing luggage 분실된 수하물
invited|[형] 초대된, 초청된|invited guests 초대된 손님들
engaged|[형] 열심인, 고용된|engaged employees 적극적으로 참여하는 직원들
missed|[형] (일정, 수업 등을) 놓친|a missed appointment 놓친 약속`
};

/* ---------- 데이터 파싱 ---------- */
const DAYS = {};
Object.keys(RAW).forEach(k=>{
  DAYS[k] = RAW[k].trim().split('\n').map(l=>{
    const p = l.split('|');
    return {w:p[0].trim(), m:p[1].trim(), e:(p[2]||'').trim()};
  });
});
// 숫자 키(1, 2, …)는 Day, 문자열 키(UNIT01, …)는 Unit — Day 먼저, 그다음 Unit 순
const DAY_KEYS = Object.keys(DAYS).map(k=>/^\d+$/.test(k)?+k:k)
  .sort((a,b)=>(typeof a===typeof b) ? (typeof a==='number' ? a-b : a.localeCompare(b)) : (typeof a==='number' ? -1 : 1));
const dayKind = d => typeof d==='number' ? 'Day' : 'Unit';
const dayNum = d => typeof d==='number' ? String(d).padStart(2,'0') : d.replace(/^\D+/,'');
const dayLabel = d => dayKind(d) + ' ' + dayNum(d);

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function meaningHTML(m){
  return esc(m).replace(/\[(명|동|형|부|표현)\]/g,'<span class="pos" data-p="$1">$1</span>');
}
function plainMeaning(m){ return m.replace(/\[[^\]]*\]/g,' ').replace(/\s+/g,' ').trim(); }
const norm = s => s.toLowerCase().replace(/[\s~\-\.\(\)\[\],;\/·]/g,'');

/* ---------- 저장소 (모르는 단어 / 오답) ---------- */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let starList = LS.get('tv_star', []);
let wrongMap = LS.get('tv_wrong', {});
let autoRemove = LS.get('tv_auto', true);
const saveStar = ()=>LS.set('tv_star', starList);
const saveWrong = ()=>LS.set('tv_wrong', wrongMap);
const isStar = w => starList.includes(w);
const ALL = {};
DAY_KEYS.forEach(d=>DAYS[d].forEach(it=>{ if(!ALL[it.w]) ALL[it.w] = {...it, day:d}; }));
const starBtn = w => `<button class="star ${isStar(w)?'on':''}" data-w="${esc(w)}" title="모르는 단어 표시">★</button>`;
const badgeHTML = w => wrongMap[w] ? `<span class="badge-wrong">오답 ${wrongMap[w]}회</span>` : '';
function toggleStar(w){
  const i = starList.indexOf(w);
  if(i>=0) starList.splice(i,1); else starList.push(w);
  saveStar();
}

/* ---------- 탭 ---------- */
function showTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.tab===t));
  $('#viewVocab').classList.toggle('hidden', t!=='vocab');
  $('#viewTest').classList.toggle('hidden', t!=='test');
  $('#viewMine').classList.toggle('hidden', t!=='mine');
  if(t==='test'){ if(!testItems.length) buildTest(); else renderTestChips(); }
  if(t==='mine') renderMine();
  window.scrollTo({top:0});
}
document.querySelectorAll('.tab').forEach(b=>{ b.onclick = ()=>showTab(b.dataset.tab); });

/* ---------- 단어장 ---------- */
let curDay = DAY_KEYS[0];
let vocabOrder = null; // null = 원래 순서
/* Day 선택 화면: 'study' = Day 하나 골라 공부, 'test' = 여러 Day 골라 시험 */
let pickMode = 'study', pickSel = new Set();
function openDayPick(mode='study'){
  pickMode = mode;
  if(mode==='test') pickSel = new Set(testDays);
  $('#dayPickTitle').textContent = mode==='test' ? '📝 시험 범위 선택' : '📘 Day/Unit 선택';
  $('#dayPickSub').textContent = mode==='test' ? '시험 볼 Day/Unit을 모두 누르세요 (여러 개 선택 가능)' : '공부할 Day/Unit을 고르세요';
  $('#pickToTest').hidden = mode==='test';
  $('#pickBar').hidden = mode!=='test';
  $('#dayGrid').classList.toggle('multi', mode==='test');
  renderDayGrid();
  $('#dayPick').hidden = false;
  document.documentElement.classList.add('picking');
  $('#dayPick .scroll').scrollTop = 0;
}
function renderDayGrid(){
  const isOn = d => pickMode==='test' ? pickSel.has(d) : d===curDay;
  $('#dayGrid').innerHTML = DAY_KEYS.map(d=>
    `<button class="dcell ${isOn(d)?'on':''}" data-d="${d}" aria-pressed="${isOn(d)}"><small>${dayKind(d)}</small><b>${dayNum(d)}</b><small>${DAYS[d].length}단어</small></button>`).join('');
  $('#dayGrid').querySelectorAll('.dcell').forEach(c=>c.onclick=()=>{
    const d = DAY_KEYS.find(k=>String(k)===c.dataset.d);
    if(pickMode==='test'){
      pickSel.has(d) ? pickSel.delete(d) : pickSel.add(d);
      renderDayGrid();
    }else{
      curDay = d; vocabOrder = null;
      leavePick(); showTab('vocab'); renderVocab();
    }
  });
  if(pickMode==='test'){
    const all = pickSel.size===DAY_KEYS.length;
    const n = new Set([...pickSel].flatMap(d=>DAYS[d].map(it=>it.w))).size;
    $('#pickAll').textContent = all ? '전체 해제' : '전체 선택';
    $('#pickStart').textContent = pickSel.size ? `시험 시작 · ${pickSel.size}개 범위 (${n}단어)` : '범위를 골라 주세요';
    $('#pickStart').disabled = !pickSel.size;
  }
}
$('#pickAll').onclick = ()=>{
  pickSel = pickSel.size===DAY_KEYS.length ? new Set() : new Set(DAY_KEYS);
  renderDayGrid();
};
$('#pickStart').onclick = ()=>{
  if(!pickSel.size) return;
  testSpecial = null; testDays = new Set(pickSel);
  leavePick(); showTab('test'); buildTest();
};
$('#pickToTest').onclick = ()=>openDayPick('test');
function closeDayPick(){
  $('#dayPick').hidden = true;
  document.documentElement.classList.remove('picking');
}
/* 뒤로가기 지원: 기록은 [Day 선택] → [본문] 두 단계로 유지 */
let nextPickMode = null;
function leavePick(){
  closeDayPick();
  if(history.state?.p !== 'main') history.pushState({p:'main'}, '');
}
function goPick(mode){
  if(history.state?.p === 'main'){ nextPickMode = mode; history.back(); } // popstate에서 열림
  else openDayPick(mode);
}
window.addEventListener('popstate', e=>{
  if(e.state?.p === 'main') closeDayPick();
  else { openDayPick(nextPickMode || pickMode); nextPickMode = null; }
});
$('#dayPickClose').onclick = leavePick;
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#dayPick').hidden) leavePick(); });
$('#vTitle').onclick = ()=>goPick('study');
$('#backPick').onclick = ()=>goPick($('#viewTest').classList.contains('hidden') ? 'study' : 'test');
function renderVocab(){
  const list = vocabOrder || DAYS[curDay];
  $('#vTitle').textContent = dayLabel(curDay);
  $('#vCount').textContent = `단어 ${list.length}개` + (vocabOrder?' · 섞은 순서':' · 교재 순서');
  $('#vocabGrid').innerHTML = list.map((it,i)=>`
    <div class="wcard">
      <div class="top"><span class="no">${i+1}</span><span class="w">${esc(it.w)}</span>${badgeHTML(it.w)}${starBtn(it.w)}</div>
      <div class="mean"><span class="mtext">${meaningHTML(it.m)}</span></div>
      ${it.e?`<div class="ex">${esc(it.e)}</div>`:''}
    </div>`).join('');
  $('#vocabGrid').querySelectorAll('.mean').forEach(m=>m.onclick=()=>m.classList.toggle('show'));
  $('#prevDay').disabled = curDay===DAY_KEYS[0];
  $('#nextDay').disabled = curDay===DAY_KEYS[DAY_KEYS.length-1];
  window.scrollTo({top:0});
}
$('#hideMean').onchange = e=>$('#vocabGrid').classList.toggle('hide-mean', e.target.checked);
$('#hideEx').onchange = e=>$('#vocabGrid').classList.toggle('hide-ex', e.target.checked);
$('#vocabShuffle').onclick = ()=>{vocabOrder = shuffle(DAYS[curDay]); renderVocab();};
$('#vocabReset').onclick = ()=>{vocabOrder = null; renderVocab();};
$('#prevDay').onclick = ()=>{const i=DAY_KEYS.indexOf(curDay); if(i>0){curDay=DAY_KEYS[i-1];vocabOrder=null;renderVocab();}};
$('#nextDay').onclick = ()=>{const i=DAY_KEYS.indexOf(curDay); if(i<DAY_KEYS.length-1){curDay=DAY_KEYS[i+1];vocabOrder=null;renderVocab();}};

/* ---------- 단어시험 ---------- */
let testDays = new Set([DAY_KEYS[0]]);
let testItems = [];
let graded = false, showAns = false;

let testSpecial = null; // null | 'star' | 'wrong'
function rangeLabel(){
  const ds = DAY_KEYS.filter(d=>testDays.has(d));
  if(ds.length===DAY_KEYS.length) return '전체 Day/Unit';
  return ds.length<=3 ? ds.map(dayLabel).join(', ') : `${dayLabel(ds[0])} 외 ${ds.length-1}개`;
}
function renderTestChips(){
  $('#testChips').innerHTML =
    `<button class="chip range ${!testSpecial?'on':''}" id="chipRange">📅 ${rangeLabel()} ▾</button>` +
    `<button class="chip ${testSpecial==='star'?'on':''}" data-sp="star">⭐ 모르는 단어 (${starList.length})</button>` +
    `<button class="chip ${testSpecial==='wrong'?'on':''}" data-sp="wrong">❌ 오답 노트 (${Object.keys(wrongMap).length})</button>`;
  $('#chipRange').onclick = ()=>goPick('test');
  $('#testChips').querySelectorAll('.chip[data-sp]').forEach(c=>c.onclick=()=>{
    testSpecial = (testSpecial===c.dataset.sp) ? null : c.dataset.sp;
    buildTest();
  });
}
function buildTest(){
  const pool = [];
  if(testSpecial){
    const ws = testSpecial==='star' ? starList : Object.keys(wrongMap);
    ws.forEach(w=>{ if(ALL[w]) pool.push({...ALL[w]}); });
  } else {
    const seen = new Set();
    DAY_KEYS.filter(d=>testDays.has(d)).forEach(d=>DAYS[d].forEach(it=>{
      if(!seen.has(it.w)){ seen.add(it.w); pool.push({...it, day:d}); }
    }));
  }
  testItems = shuffle(pool);
  graded = false; showAns = false;
  $('#ansBtn').textContent = '👀 정답 보기';
  renderTest();
}
function renderTest(){
  renderTestChips();
  const mode = $('#mode').value;
  const ds = DAY_KEYS.filter(d=>testDays.has(d));
  const title = testSpecial ? (testSpecial==='star'?'⭐ 모르는 단어':'❌ 오답 노트') : (ds.length===DAY_KEYS.length ? '전체' : ds.map(dayLabel).join(', '));
  $('#sheetTitle').textContent = `📝 ${title} · 단어시험 ${testItems.length}문제 · ` + (mode==='en2ko'?'영어를 보고 한글 뜻을 쓰세요':'한글 뜻을 보고 영어 단어를 쓰세요');
  $('#score').textContent = '';
  if(!testItems.length){ $('#sheetBody').innerHTML = (testSpecial ? '<div class="empty">아직 저장된 단어가 없어요. 단어장에서 ⭐를 누르거나 시험에서 틀려 보세요.</div>' : '<div class="empty">출제할 단어가 없습니다.</div>'); return; }
  $('#sheetBody').innerHTML = testItems.map((it,i)=>{
    const prompt = mode==='en2ko'
      ? `<div class="p">${esc(it.w)}${starBtn(it.w)}</div>`
      : `<div class="p ko">${meaningHTML(it.m)}${starBtn(it.w)}</div>`;
    const answer = mode==='en2ko'
      ? `정답: ${meaningHTML(it.m)}`
      : `정답: <b>${esc(it.w)}</b>`;
    return `<div class="q" data-i="${i}">
      <div class="n">${i+1}</div>${prompt}
      <div class="in"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${mode==='en2ko'?'뜻':'영어 단어'}"></div>
      <div class="res"></div>
      <div class="ans">${answer}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('#sheetBody .q').forEach(q=>{
    q.querySelector('.res').onclick = ()=>{
      if(!graded) return;
      const ok = q.classList.contains('ok');
      setMark(q, !ok); updateScore(); renderTestChips();
    };
    q.querySelector('input').addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const next = q.nextElementSibling;
        if(next) next.querySelector('input').focus();
      }
    });
  });
}
function setMark(q, ok){
  q.classList.remove('ok','ng');
  q.classList.add(ok?'ok':'ng');
  q.querySelector('.res').textContent = ok?'O':'X';
  q.querySelector('.ans').classList.add('on');
  const w = testItems[+q.dataset.i].w;
  if(!ok){
    if(!q._cnt){ wrongMap[w] = (wrongMap[w]||0)+1; q._cnt = true; saveWrong(); }
  } else if(q._cnt){
    if(wrongMap[w]){ wrongMap[w] -= 1; if(wrongMap[w]<=0) delete wrongMap[w]; }
    q._cnt = false; saveWrong();
  } else if(autoRemove && wrongMap[w]){
    delete wrongMap[w]; saveWrong();
  }
}
function judge(it, input, mode){
  const u = norm(input);
  if(!u) return false;
  if(mode==='ko2en') return u === norm(it.w);
  const toks = it.m.replace(/\[[^\]]*\]/g,'|').replace(/\([^)]*\)/g,'')
    .split(/[|,;\/]/).map(norm).filter(Boolean);
  return toks.some(t => u===t || (u.length>=2 && t.length>=2 && (t.includes(u) || u.includes(t))));
}
function updateScore(){
  const qs = document.querySelectorAll('#sheetBody .q');
  const ok = document.querySelectorAll('#sheetBody .q.ok').length;
  $('#score').textContent = `점수 ${ok} / ${qs.length}  (${Math.round(ok/qs.length*100)}점)`;
}
function grade(){
  const mode = $('#mode').value;
  document.querySelectorAll('#sheetBody .q').forEach(q=>{
    const it = testItems[+q.dataset.i];
    setMark(q, judge(it, q.querySelector('input').value, mode));
  });
  graded = true; updateScore(); renderTestChips();
}
$('#refresh').onclick = ()=>{ buildTest(); window.scrollTo({top:0}); };
$('#mode').onchange = ()=>buildTest();
$('#gradeBtn').onclick = grade;
$('#ansBtn').onclick = ()=>{
  showAns = !showAns;
  document.querySelectorAll('#sheetBody .q .ans').forEach(a=>a.classList.toggle('on', showAns || a.parentElement.classList.contains('ok') || a.parentElement.classList.contains('ng')));
  $('#ansBtn').textContent = showAns ? '🙈 정답 숨기기' : '👀 정답 보기';
};
$('#printBtn').onclick = ()=>window.print();

/* ---------- 내 단어장 ---------- */
let mineSub = 'star';
function mineWords(){
  return mineSub==='star'
    ? starList.filter(w=>ALL[w]).map(w=>ALL[w])
    : Object.keys(wrongMap).filter(w=>ALL[w]).sort((a,b)=>wrongMap[b]-wrongMap[a]).map(w=>ALL[w]);
}
function renderMineChips(){
  $('#mineChips').innerHTML =
    `<button class="chip ${mineSub==='star'?'on':''}" data-s="star">⭐ 모르는 단어 (${starList.length})</button>` +
    `<button class="chip ${mineSub==='wrong'?'on':''}" data-s="wrong">❌ 오답 노트 (${Object.keys(wrongMap).length})</button>`;
  $('#mineChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ mineSub=c.dataset.s; renderMine(); });
}
function renderMine(){
  renderMineChips();
  const list = mineWords();
  $('#mineGrid').classList.toggle('hide-mean', $('#mineHide').checked);
  $('#mineGrid').innerHTML = list.length ? list.map(it=>`
    <div class="wcard">
      <div class="top"><span class="w">${esc(it.w)}</span><span class="tag">${dayLabel(it.day)}</span>${badgeHTML(it.w)}${starBtn(it.w)}</div>
      <div class="mean"><span class="mtext">${meaningHTML(it.m)}</span></div>
      ${it.e?`<div class="ex">${esc(it.e)}</div>`:''}
      ${mineSub==='wrong'?`<div style="margin-top:8px"><button class="btn sm" data-rmwrong="${esc(it.w)}">✓ 오답 노트에서 삭제</button></div>`:''}
    </div>`).join('')
    : `<div class="empty" style="grid-column:1/-1">${mineSub==='star'?'아직 ⭐ 표시한 단어가 없어요. 단어장에서 별을 눌러 보세요.':'오답 노트가 비어 있어요. 시험에서 틀린 단어가 자동으로 쌓입니다.'}</div>`;
  $('#mineGrid').querySelectorAll('.mean').forEach(m=>m.onclick=()=>m.classList.toggle('show'));
}
document.addEventListener('click', e=>{
  const sb = e.target.closest('.star');
  if(sb){
    const w = sb.dataset.w;
    toggleStar(w);
    document.querySelectorAll('.star').forEach(x=>{ if(x.dataset.w===w) x.classList.toggle('on', isStar(w)); });
    renderMineChips();
    if(!$('#viewTest').classList.contains('hidden')) renderTestChips();
    return;
  }
  const rb = e.target.closest('[data-rmwrong]');
  if(rb){ delete wrongMap[rb.dataset.rmwrong]; saveWrong(); renderMine(); }
});
$('#mineHide').onchange = ()=>$('#mineGrid').classList.toggle('hide-mean', $('#mineHide').checked);
$('#mineTest').onclick = ()=>{ testSpecial = mineSub; showTab('test'); buildTest(); };
$('#mineClear').onclick = ()=>{
  if(!confirm(mineSub==='star' ? '모르는 단어 목록을 모두 비울까요?' : '오답 노트를 모두 비울까요?')) return;
  if(mineSub==='star'){ starList = []; saveStar(); } else { wrongMap = {}; saveWrong(); }
  renderMine();
};
$('#mineExport').onclick = async ()=>{
  const t = JSON.stringify({star:starList, wrong:wrongMap});
  try{ await navigator.clipboard.writeText(t); alert('백업 내용을 복사했어요. 다른 기기의 "백업 복원"에 붙여넣으세요.'); }
  catch(err){ prompt('아래 내용을 복사하세요', t); }
};
$('#mineImport').onclick = ()=>{
  const t = prompt('백업 내용을 붙여넣으세요');
  if(!t) return;
  try{
    const o = JSON.parse(t);
    (o.star||[]).forEach(w=>{ if(!starList.includes(w)) starList.push(w); });
    Object.entries(o.wrong||{}).forEach(([w,n])=>{ wrongMap[w] = Math.max(wrongMap[w]||0, +n||1); });
    saveStar(); saveWrong(); renderMine(); alert('복원했어요.');
  }catch(err){ alert('형식이 올바르지 않아요.'); }
};
$('#autoRm').checked = autoRemove;
$('#autoRm').onchange = e=>{ autoRemove = e.target.checked; LS.set('tv_auto', autoRemove); };

renderVocab();
history.replaceState({p:'pick'}, '');
openDayPick(); // 처음 열면 Day 선택 화면부터 (잠금 중이면 해제 후 보임)
</script>
<script>
/* 비밀번호 잠금 */
(()=>{
  const PASSWORD = '0827';
  const lock = document.getElementById('lock'), pw = document.getElementById('lockPw'), err = document.getElementById('lockErr');
  if(document.documentElement.classList.contains('locked')) pw.focus();
  document.getElementById('lockForm').onsubmit = e=>{
    e.preventDefault();
    if(pw.value === PASSWORD){
      try{ sessionStorage.setItem('tv_unlock','1'); }catch(e){}
      document.documentElement.classList.remove('locked');
    }else{
      err.textContent = '비밀번호가 틀렸어요.';
      pw.value = ''; pw.focus();
      lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake');
    }
  };
})();
</script>
